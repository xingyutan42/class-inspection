<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3056d3">
<script>try{if(localStorage.getItem('demo_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<meta name="format-detection" content="telephone=no">
<title>首页</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css?v=20261101c">
</head>
<body>
<div id="app">
  <div class="shell" style="max-width:460px">
    <div class="topbar">
      <div class="side"></div>
      <h1>首页</h1>
      <div class="side right">
        <button class="iconbtn" data-theme-toggle onclick="App.toggleTheme()" title="切换深色模式" aria-label="切换深色模式">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <!-- 欢迎卡片 -->
    <div class="card mt12">
      <div class="hd">
        <h2 id="greeting">欢迎回来</h2>
        <span class="tiny muted" id="today"></span>
      </div>
      <div class="sm ink2" id="welcomeText">你已成功登录，这里是首页。</div>
    </div>

    <!-- 数据总览 -->
    <div class="card">
      <div class="hd"><h2>数据总览</h2><span class="tiny muted" id="statsTip"></span></div>
      <div class="stat-grid">
        <div class="stat"><div class="n" id="statWeek">-</div><div class="t">本周查课</div></div>
        <div class="stat ok"><div class="n" id="statTotal">-</div><div class="t">累计查课</div></div>
        <div class="stat warn"><div class="n" id="statPlans">-</div><div class="t">选课计划</div></div>
      </div>
    </div>

    <!-- 功能入口（示例） -->
    <div class="card">
      <div class="hd"><h2>功能入口</h2><span class="tiny muted">示例</span></div>
      <div class="list">
        <div class="litem">
          <div class="t1">我的任务</div>
          <div class="t2">查看并处理待办事项</div>
        </div>
        <div class="litem">
          <div class="t1">消息通知</div>
          <div class="t2">查看最新通知与提醒</div>
        </div>
        <div class="litem">
          <div class="t1">个人设置</div>
          <div class="t2">账号信息与偏好设置</div>
        </div>
      </div>
    </div>

    <!-- 退出登录 -->
    <button class="btn btn-danger btn-block btn-lg mt16" onclick="doLogout()">退出登录</button>
    <div class="center tiny muted mt12">功能入口为示例展示，暂未接入实际页面</div>
  </div>
</div>

<script src="vendor/workbuddy-cloud-sdk.js?v=20261101c"></script>
<script src="config.js?v=20261101c"></script>
<script src="app.js?v=20261101c"></script>
<script>
// 未登录或登录失效则跳回登录页；成功则展示真实数据
App.boot().then(function (d) {
  var me = d.me || {}
  document.getElementById('greeting').textContent = '欢迎回来，' + (me.name || '同学')

  var now = new Date()
  var week = ['日', '一', '二', '三', '四', '五', '六']
  document.getElementById('today').textContent =
    now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 星期' + week[now.getDay()]
  document.getElementById('welcomeText').textContent =
    '你已成功登录，这里是首页。当前时间为 ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0') + '。'

  var s = d.stats || {}
  document.getElementById('statWeek').textContent = s.week_records != null ? s.week_records : '-'
  document.getElementById('statTotal').textContent = s.total_records != null ? s.total_records : '-'
  document.getElementById('statPlans').textContent = s.total_plans != null ? s.total_plans : '-'
}).catch(function () {
  location.replace('index.html')
})

function doLogout() {
  if (!confirm('确定要退出登录吗？')) return
  App.logout().then(function () {
    location.href = 'index.html'
  })
}
</script>
</body>
</html>
