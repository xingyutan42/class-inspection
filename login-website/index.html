<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3056d3">
<script>try{if(localStorage.getItem('demo_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<meta name="format-detection" content="telephone=no">
<title>登录</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css?v=20261101c">
</head>
<body>
<div id="app">
  <div class="shell" style="max-width:460px; position:relative">
    <button class="iconbtn auth-theme" data-theme-toggle onclick="App.toggleTheme()" title="切换深色模式" aria-label="切换深色模式">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <div class="auth-hero">
      <h1>欢迎回来</h1>
      <p>请登录你的账号以继续使用</p>
    </div>

    <div class="auth-card">
      <div class="formerr" id="err" style="display:none"></div>

      <div class="field">
        <label class="label" for="name">姓名</label>
        <input class="input" id="name" placeholder="请输入你的姓名" autocomplete="username">
      </div>
      <div class="field">
        <label class="label" for="pwd">密码</label>
        <input class="input" id="pwd" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-block btn-lg" id="loginBtn" onclick="doLogin()">登录</button>

      <div class="row between mt12">
        <span class="tiny muted">账号：姓名 · 初始密码为本人学号 · 首次登录须修改密码</span>
      </div>
    </div>

    <div class="center tiny muted mt16">登录即表示同意用户协议与隐私政策</div>
  </div>
</div>

<script src="vendor/workbuddy-cloud-sdk.js?v=20261101c"></script>
<script src="config.js?v=20261101c"></script>
<script src="app.js?v=20261101c"></script>
<script>
function showErr(msg) {
  var el = document.getElementById('err')
  el.textContent = msg
  el.style.display = 'block'
}

function doLogin() {
  var errEl = document.getElementById('err')
  errEl.style.display = 'none'

  var name = document.getElementById('name').value.trim()
  var pwd = document.getElementById('pwd').value

  if (!name) { showErr('请输入姓名'); return }
  if (!pwd) { showErr('请输入密码'); return }

  var btn = document.getElementById('loginBtn')
  btn.disabled = true
  btn.textContent = '登录中…'

  App.login(name, pwd).then(function () {
    location.href = 'home.html'
  }).catch(function (e) {
    showErr(App.errText(e))
    btn.disabled = false
    btn.textContent = '登录'
  })
}

document.getElementById('pwd').addEventListener('keyup', function (e) {
  if (e.key === 'Enter') doLogin()
})
document.getElementById('name').addEventListener('keyup', function (e) {
  if (e.key === 'Enter') doLogin()
})
</script>
</body>
</html>
